<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Flashcards</title>
  <style>
    :root { color-scheme: light; --ink:#171717; --muted:#666; --line:#d9d9d9; --paper:#fbfbfa; --accent:#1f6feb; --ok:#227a45; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    main { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
    header, footer { padding:16px clamp(16px,4vw,40px); border-bottom:1px solid var(--line); background:#fff; }
    footer { border-top:1px solid var(--line); border-bottom:0; color:var(--muted); font-size:13px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:0; }
    .sub { margin-top:4px; color:var(--muted); font-size:14px; }
    .wrap { width:min(920px,100%); margin:0 auto; padding:24px clamp(16px,4vw,40px); display:grid; gap:16px; align-content:center; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .toolbar-left, .toolbar-right { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button, select { height:40px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:0 12px; font:inherit; cursor:pointer; }
    button:hover { border-color:#a8a8a8; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.good { color:var(--ok); }
    select { min-width:160px; }
    .card { min-height:320px; border:1px solid var(--line); border-radius:8px; background:#fff; display:grid; place-items:center; padding:24px; text-align:center; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .term { font-size:clamp(30px, 5vw, 64px); line-height:1.12; overflow-wrap:anywhere; }
    .answer { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); color:#333; font-size:clamp(20px, 3vw, 34px); line-height:1.25; overflow-wrap:anywhere; }
    .hint { margin-top:18px; color:#555; font-size:15px; }
    .meta { color:var(--muted); font-size:14px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .progress { height:8px; background:#e9e9e7; border-radius:999px; overflow:hidden; }
    .bar { height:100%; width:0%; background:var(--accent); transition:width .2s ease; }
    .list { display:none; max-height:280px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px; }
    .list.show { display:block; }
    .row { width:100%; text-align:left; height:auto; min-height:36px; justify-content:flex-start; display:block; margin:0; border:0; border-radius:6px; }
    .row:hover { background:#f1f1ef; }
    @media (max-width: 640px) { .toolbar { align-items:stretch; } .toolbar-left, .toolbar-right, button, select { width:100%; } .card { min-height:280px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Japanese Flashcards</h1>
    <div class="sub"><span id="count">0</span> cards from the Notion page</div>
  </header>
  <section class="wrap">
    <div class="toolbar">
      <div class="toolbar-left">
        <select id="category"></select>
        <button id="shuffle" title="Shuffle deck">Shuffle</button>
        <button id="listToggle" title="Show card list">List</button>
      </div>
      <div class="toolbar-right">
        <button id="hintBtn" title="Reveal toggle heading hint">Hint</button>
        <button id="flip" class="primary" title="Flip card">Flip</button>
      </div>
    </div>
    <div class="meta"><span id="position"></span><span id="status">Front</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <button class="card" id="card" title="Click to flip">
      <div>
        <div class="term" id="front"></div>
        <div class="answer" id="back" hidden></div>
        <div class="hint" id="hint" hidden></div>
      </div>
    </button>
    <div class="toolbar">
      <button id="prev" title="Previous card">Previous</button>
      <button id="known" class="good" title="Mark card known and advance">Know it</button>
      <button id="next" title="Next card">Next</button>
    </div>
    <div class="list" id="list"></div>
  </section>
  <footer><span>Hint reveals the Notion toggle heading.</span><span id="knownCount">0 known</span></footer>
</main>
<script>
let allCards=[], deck=[], index=0, flipped=false, hintShown=false;
const known = new Set(JSON.parse(localStorage.getItem('jp-known') || '[]'));
const $ = id => document.getElementById(id);
function saveKnown(){ localStorage.setItem('jp-known', JSON.stringify([...known])); }
function categories(){ return ['All', ...Array.from(new Set(allCards.map(c => c.hint || 'Unsorted'))).sort((a,b)=>a.localeCompare(b))]; }
function setDeck(){ const cat=$('category').value; deck = cat==='All' ? [...allCards] : allCards.filter(c => (c.hint || 'Unsorted') === cat); index=0; flipped=false; hintShown=false; renderList(); render(); }
function shuffle(){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } index=0; flipped=false; hintShown=false; renderList(); render(); }
function card(){ return deck[index] || {}; }
function render(){ const c=card(); $('count').textContent=allCards.length; $('front').textContent=c.front || 'No cards'; $('back').textContent=c.back || ''; $('back').hidden=!flipped; $('hint').textContent=c.hint ? 'Hint: '+c.hint : 'No toggle heading'; $('hint').hidden=!hintShown; $('position').textContent=deck.length ? (index+1)+' / '+deck.length : '0 / 0'; $('status').textContent=flipped ? 'Back' : 'Front'; $('bar').style.width=deck.length ? (((index+1)/deck.length)*100)+'%' : '0%'; $('knownCount').textContent=known.size+' known'; $('known').textContent=known.has(c.id) ? 'Known' : 'Know it'; }
function renderList(){ $('list').innerHTML = deck.map((c,i)=>'<button class="row" data-i="'+i+'">'+(i+1)+'. '+escapeHtml(c.front)+' <span style="color:#777">'+escapeHtml(c.hint||'')+'</span></button>').join(''); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function move(n){ if(!deck.length) return; index=(index+n+deck.length)%deck.length; flipped=false; hintShown=false; render(); }
$('card').onclick=()=>{ flipped=!flipped; render(); };
$('flip').onclick=()=>{ flipped=!flipped; render(); };
$('hintBtn').onclick=()=>{ hintShown=!hintShown; render(); };
$('prev').onclick=()=>move(-1); $('next').onclick=()=>move(1);
$('known').onclick=()=>{ const c=card(); if(c.id){ known.add(c.id); saveKnown(); move(1); } };
$('shuffle').onclick=shuffle; $('category').onchange=setDeck;
$('listToggle').onclick=()=>$('list').classList.toggle('show');
$('list').onclick=e=>{ const btn=e.target.closest('button[data-i]'); if(btn){ index=Number(btn.dataset.i); flipped=false; hintShown=false; render(); } };
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') move(1); if(e.key==='ArrowLeft') move(-1); if(e.key===' ') { e.preventDefault(); flipped=!flipped; render(); } if(e.key.toLowerCase()==='h'){ hintShown=!hintShown; render(); }});
fetch('cards.json').then(r=>r.json()).then(cards=>{ allCards=cards; $('category').innerHTML=categories().map(c=>'<option>'+escapeHtml(c)+'</option>').join(''); setDeck(); });
</script>
</body>
</html>
